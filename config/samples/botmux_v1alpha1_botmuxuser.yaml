apiVersion: v1
kind: Secret
metadata:
  name: alice-lark
type: Opaque
stringData:
  appSecret: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: alice-codex
type: Opaque
stringData:
  OPENAI_API_KEY: replace-me
---
apiVersion: botmux.io/v1alpha1
kind: BotmuxUser
metadata:
  name: alice
spec:
  lark:
    appId: cli_replace_me
    brand: feishu
    credentialsSecretRef:
      name: alice-lark
  runtime:
    cliId: codex
    envFromSecretRefs:
    - name: alice-codex
  workspace:
    size: 20Gi
    reclaimPolicy: Retain
  ingress:
    enabled: false
