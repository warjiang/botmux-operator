name: Publish images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Image tag to publish
        required: true
      botmux_version:
        description: Exact npm botmux version
        required: true
      codex_version:
        description: Exact @openai/codex version
        required: true
      claude_code_version:
        description: Exact @anthropic-ai/claude-code version
        required: true
      gemini_version:
        description: Exact @google/gemini-cli version
        required: true

concurrency:
  group: publish-images
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Validate release inputs
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        BOTMUX_VERSION: ${{ inputs.botmux_version }}
        CODEX_VERSION: ${{ inputs.codex_version }}
        CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
        GEMINI_VERSION: ${{ inputs.gemini_version }}
      run: |
        semver='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?'
        [[ "${RELEASE_TAG}" =~ ^v?${semver}$ ]] || {
          echo "release_tag must be an exact semantic version, optionally prefixed with v" >&2
          exit 1
        }
        for version in "${BOTMUX_VERSION}" "${CODEX_VERSION}" "${CLAUDE_CODE_VERSION}" "${GEMINI_VERSION}"; do
          [[ "${version}" =~ ^${semver}$ ]] || {
            echo "npm package versions must be exact semantic versions" >&2
            exit 1
          }
        done
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push operator
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ghcr.io/warjiang/botmux-operator:${{ inputs.release_tag }}
        provenance: mode=max
        sbom: true
    - name: Build and push base runtime
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: runtime/base
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: BOTMUX_VERSION=${{ inputs.botmux_version }}
        tags: ghcr.io/warjiang/botmux-runtime-base:${{ inputs.release_tag }}
        provenance: mode=max
        sbom: true
    - name: Build and push Codex runtime
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: runtime/codex
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=ghcr.io/warjiang/botmux-runtime-base:${{ inputs.release_tag }}
          CODEX_VERSION=${{ inputs.codex_version }}
        tags: ghcr.io/warjiang/botmux-runtime-codex:${{ inputs.release_tag }}
        provenance: mode=max
        sbom: true
    - name: Build and push Claude runtime
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: runtime/claude
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=ghcr.io/warjiang/botmux-runtime-base:${{ inputs.release_tag }}
          CLAUDE_CODE_VERSION=${{ inputs.claude_code_version }}
        tags: ghcr.io/warjiang/botmux-runtime-claude:${{ inputs.release_tag }}
        provenance: mode=max
        sbom: true
    - name: Build and push Gemini runtime
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: runtime/gemini
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          BASE_IMAGE=ghcr.io/warjiang/botmux-runtime-base:${{ inputs.release_tag }}
          GEMINI_VERSION=${{ inputs.gemini_version }}
        tags: ghcr.io/warjiang/botmux-runtime-gemini:${{ inputs.release_tag }}
        provenance: mode=max
        sbom: true
