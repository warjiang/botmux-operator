name: CI

on:
  pull_request:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v6
      with:
        go-version: "1.26.0"
        cache: true
    - name: Verify formatting
      run: test -z "$(gofmt -l .)"
    - name: Generate manifests
      run: make manifests generate
    - name: Verify generated files
      run: git diff --exit-code
    - name: Vet and unit tests
      run: go vet ./... && go test ./... -race -coverprofile=cover.out
    - name: Staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1 && staticcheck ./...
    - name: Envtest
      run: make envtest
    - name: Build
      run: go build -o /tmp/manager ./cmd

  kind:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v6
      with:
        go-version: "1.26.0"
        cache: true
    - uses: helm/kind-action@v1
      with:
        install_only: true
    - name: Install kustomize
      run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
    - name: Kind end-to-end
      run: test/e2e/kind.sh
